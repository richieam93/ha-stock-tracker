# =============================================================================
# STOCK TRACKER - OVERVIEW DASHBOARD
# =============================================================================
#
# Fertige Beispielansicht für die integrierten Stock-Tracker-Karten.
# Passe die Entity IDs an deine vorhandenen Symbole an.
#
# =============================================================================

title: 📊 Stock Tracker
views:
  - title: Übersicht
    path: overview
    icon: mdi:view-dashboard
    badges: []
    cards:
      - type: markdown
        content: |
          # 📊 Marktübersicht

          Stand: {{ now().strftime('%d.%m.%Y um %H:%M') }} Uhr

      - type: custom:stock-tracker-pro-card
        title: "📈 Markt-Monitor"
        view_mode: performance
        show_search: true
        show_summary: true
        show_top_bottom: true
        max_items: 12

      - type: custom:stock-tracker-list-card
        title: "📋 Alle Werte"

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:stock-tracker-card
            entity: sensor.aapl_price
            display_mode: compact
            show_indicators: false
          - type: custom:stock-tracker-card
            entity: sensor.msft_price
            display_mode: compact
            show_indicators: false
          - type: custom:stock-tracker-card
            entity: sensor.tsla_price
            display_mode: compact
            show_indicators: false
          - type: custom:stock-tracker-card
            entity: sensor.sap_de_price
            display_mode: compact
            show_indicators: false

      - type: history-graph
        title: 📉 Kursverlauf (24 Stunden)
        hours_to_show: 24
        entities:
          - entity: sensor.aapl_price
            name: Apple
          - entity: sensor.msft_price
            name: Microsoft
          - entity: sensor.tsla_price
            name: Tesla

      - type: horizontal-stack
        cards:
          - type: button
            name: Daten aktualisieren
            icon: mdi:refresh
            tap_action:
              action: call-service
              service: stock_tracker.refresh
          - type: button
            name: Aktie suchen
            icon: mdi:magnify
            tap_action:
              action: call-service
              service: stock_tracker.search
              service_data:
                query: Apple
                limit: 5

  - title: Portfolio
    path: portfolio
    icon: mdi:briefcase
    cards:
      - type: markdown
        content: |
          # 💼 Portfolio

          Beispiel mit Holdings und Performance.

      - type: custom:stock-tracker-pro-card
        title: "💼 Mein Portfolio"
        view_mode: tiles
        show_search: true
        show_summary: true
        show_top_bottom: true
        show_portfolio: true
        holdings:
          AAPL: 10
          MSFT: 5
          TSLA: 2
          BTC-USD: 0.25
        entities:
          - sensor.aapl_price
          - sensor.msft_price
          - sensor.tsla_price
          - sensor.btc_usd_price

      - type: entities
        title: 📊 Trends & Signale
        show_header_toggle: false
        entities:
          - entity: sensor.aapl_trend
            name: Apple Trend
          - entity: sensor.msft_trend
            name: Microsoft Trend
          - entity: sensor.tsla_trend
            name: Tesla Trend
          - entity: sensor.btc_usd_trend
            name: Bitcoin Trend
          - entity: sensor.aapl_indicators
            name: Apple Signale
          - entity: sensor.msft_indicators
            name: Microsoft Signale
          - entity: sensor.tsla_indicators
            name: Tesla Signale
          - entity: sensor.btc_usd_indicators
            name: Bitcoin Signale

  - title: Details
    path: details
    icon: mdi:chart-line
    cards:
      - type: custom:stock-tracker-card
        entity: sensor.aapl_price
        display_mode: full
        show_chart: true
        show_indicators: true
