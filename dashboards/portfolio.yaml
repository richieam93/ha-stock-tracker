# =============================================================================
# STOCK TRACKER - PORTFOLIO DASHBOARD
# =============================================================================
# Fokus auf Portfolio-Auswertung mit der neuen Pro-Karte.
# =============================================================================

title: 💼 Portfolio
views:
  - title: Portfolio
    path: portfolio
    icon: mdi:briefcase
    cards:
      - type: markdown
        content: |
          # 💼 Mein Portfolio

          Stand: **{{ now().strftime('%A, %d. %B %Y') }}** um {{ now().strftime('%H:%M') }} Uhr

      - type: custom:stock-tracker-pro-card
        title: "💼 Portfolio-Monitor"
        view_mode: performance
        show_search: true
        show_summary: true
        show_top_bottom: true
        show_portfolio: true
        max_items: 10
        holdings:
          AAPL: 10
          MSFT: 5
          TSLA: 2
          GOOGL: 3
          BTC-USD: 0.25
        entities:
          - sensor.aapl_price
          - sensor.msft_price
          - sensor.tsla_price
          - sensor.googl_price
          - sensor.btc_usd_price

      - type: history-graph
        title: 📉 Kursverlauf (7 Tage)
        hours_to_show: 168
        refresh_interval: 300
        entities:
          - entity: sensor.aapl_price
            name: Apple
          - entity: sensor.msft_price
            name: Microsoft
          - entity: sensor.tsla_price
            name: Tesla
          - entity: sensor.btc_usd_price
            name: Bitcoin

      - type: entities
        title: 📦 Zusätzliche Marktwerte
        show_header_toggle: false
        entities:
          - entity: sensor.aapl_volume
            name: Apple Volumen
          - entity: sensor.msft_volume
            name: Microsoft Volumen
          - entity: sensor.tsla_volume
            name: Tesla Volumen
          - entity: sensor.aapl_trend
            name: Apple Trend
          - entity: sensor.msft_trend
            name: Microsoft Trend
          - entity: sensor.tsla_trend
            name: Tesla Trend
